<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Search song lyrics from lrclib.net. No account, no API key."
    />
    <meta name="color-scheme" content="light dark" />
    <title>Lyrics Finder</title>
    <script>
      (function () {
        var d = document.documentElement;
        try {
          var mode = JSON.parse(localStorage.getItem("lyricsfinder.v2.mode") || "null");
          if (mode !== "light" && mode !== "dark")
            mode = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          d.dataset.mode = mode;
          d.style.colorScheme = mode;
        } catch (e) {
          d.dataset.mode = "dark";
        }
        d.dataset.motion = "off";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
